<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Modern Portfolio Gallery</title>

  <!-- Google Fonts -->
  <link rel="stylesheet" href="script3.css">
  <link rel="stylesheet" href="script3.css" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HERO SECTION -->
  <section class="hero">

    <!-- NAVBAR -->
    <nav class="navbar">

      <div class="logo">
        ALFA GALLERY
      </div>

      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Gallery</a></li>
        <li><a href="#">Portfolio</a></li>
        <li><a href="#">Contact</a></li>
      </ul>

      <button class="nav-btn">Get Started</button>

    </nav>

    <!-- HERO CONTENT -->
    <div class="hero-content">

      <p class="small-title">Modern Portfolio Website</p>

      <h1>
        Create a stunning <br>
        image gallery that <br>
        impresses everyone
      </h1>

      <button class="hero-btn">
        Explore Gallery
      </button>

    </div>

  </section>

  <!-- FILTER BUTTONS -->
  <section class="filters-section">

    <div class="filters">

      <button onclick="filterImages('all')">All</button>
      <button onclick="filterImages('nature')">Nature</button>
      <button onclick="filterImages('cars')">Cars</button>
      <button onclick="filterImages('animals')">Animals</button>

    </div>

  </section>

  <!-- GALLERY -->
  <section class="gallery-section">

    <div class="gallery">

      <div class="image nature">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200&auto=format&fit=crop">
      </div>

      <div class="image cars">
        <img src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?q=80&w=1200&auto=format&fit=crop">
      </div>

      <div class="image animals">
        <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?q=80&w=1200&auto=format&fit=crop">
      </div>

      <div class="image nature">
        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=1200&auto=format&fit=crop">
      </div>

      <div class="image cars">
        <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=1200&auto=format&fit=crop">
      </div>

      <div class="image animals">
        <img src="https://images.unsplash.com/photo-1517423440428-a5a00ad493e8?q=80&w=1200&auto=format&fit=crop">
      </div>

    </div>

  </section>

  <!-- LIGHTBOX -->
  <div class="lightbox">

    <span class="close">&times;</span>

    <button class="prev">&#10094;</button>

    <img class="lightbox-img" src="">

    <button class="next">&#10095;</button>

  </div>

  <script src="script.js"></script>

</body>

</html>
